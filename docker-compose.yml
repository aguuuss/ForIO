services:
  postgres:
    image: postgres:16-alpine
    container_name: forio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-forio}
      POSTGRES_USER: ${POSTGRES_USER:-forio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
